name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ./cli lint: ruff and pyright at ./cli's pins. pyright needs the package's dependencies and
  # the crate's installed type stub, so this job sets up as the test jobs do (same caches) and
  # skips only the dataset and tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.14"

      - name: Cache venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Rust wheel key
        id: rust-commit
        run: |
          echo "sha=$(git -C rust rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "maturin=$(sed -n 's/^maturin_version="\(.*\)"$/\1/p' cli)" >> "$GITHUB_OUTPUT"

      - name: Cache crate wheel
        id: rust-wheel
        uses: actions/cache@v6
        with:
          path: .rust-wheel
          key: rust-wheel-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-maturin${{ steps.rust-commit.outputs.maturin }}-${{ steps.rust-commit.outputs.sha }}

      - name: Install pinned Rust toolchain
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        working-directory: rust
        run: rustup toolchain install

      - name: Cache crate dependency builds
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Setup
        run: ./cli setup --rust-wheel-dir .rust-wheel --no-data

      - name: Lint
        run: ./cli lint

  test:
    # Parallel jobs: rust/tests/ whole, and tests/ split into 8 shards (tests/conftest.py's
    # --shard I/N: every Nth test in collection order, so the slow parametrized tests spread across
    # them). Each job pays its own setup (about 20 s on a cache hit); the wall-clock is the slowest
    # shard's, not the suite's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: rust/tests/, shard: ""}
          - {suite: tests/, shard: 0/8}
          - {suite: tests/, shard: 1/8}
          - {suite: tests/, shard: 2/8}
          - {suite: tests/, shard: 3/8}
          - {suite: tests/, shard: 4/8}
          - {suite: tests/, shard: 5/8}
          - {suite: tests/, shard: 6/8}
          - {suite: tests/, shard: 7/8}
    name: test (${{ matrix.suite }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.14"

      # The whole venv, keyed on the exact interpreter and requirements.txt, so a hit leaves pip
      # nothing to install (maturin is pinned in ./cli, so pip enforces that pin on a hit too);
      # indrajala_math_rust inside the venv is always reinstalled by ./cli setup.
      - name: Cache venv
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      # Keyed on scripts/fetch_datasets.py's own content, which embeds every dataset's pinned
      # tag and each file's expected SHA-256 - so bumping either one changes the hash and
      # invalidates the cache automatically, rather than risking a stale cache silently serving
      # old data forever. MNIST and the sequence task's four corpora.
      - name: Cache datasets
        uses: actions/cache@v6
        with:
          path: |
            data/mnist
            data/tinyshakespeare
            data/herodotus-rawlinson
            data/muqaddimah
            data/euclid-heath
          key: datasets-${{ hashFiles('scripts/fetch_datasets.py') }}

      # The crate's release wheel, keyed on the rust/ submodule commit, the maturin pin in ./cli
      # and the interpreter (the wheel is cp310-specific). Most PRs move none of them, so a hit
      # skips compiling the crate.
      - name: Rust wheel key
        id: rust-commit
        run: |
          echo "sha=$(git -C rust rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "maturin=$(sed -n 's/^maturin_version="\(.*\)"$/\1/p' cli)" >> "$GITHUB_OUTPUT"

      - name: Cache crate wheel
        id: rust-wheel
        uses: actions/cache@v6
        with:
          path: .rust-wheel
          key: rust-wheel-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-maturin${{ steps.rust-commit.outputs.maturin }}-${{ steps.rust-commit.outputs.sha }}

      # Only on a wheel-cache miss (a submodule bump): rust/target's dependency builds, keyed by
      # rust-cache on the toolchain, Cargo.lock and Cargo.toml; the crate itself always recompiles.
      # rust/rust-toolchain.toml's pinned toolchain, installed before rust-cache so the cache is
      # keyed on it rather than the runner image's stable.
      - name: Install pinned Rust toolchain
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        working-directory: rust
        run: rustup toolchain install

      - name: Cache crate dependency builds
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Setup
        run: ./cli setup --rust-wheel-dir .rust-wheel

      - name: Test
        run: ./cli test ${{ matrix.suite }} ${{ matrix.shard && format('--shard {0}', matrix.shard) || '' }}

      # The crate's bits are the same on every machine (the aarch64 workplan, D1), so its golden
      # entries are a committed reference, checked here on the short job (about 1 s).
      - name: Golden run (Rust)
        if: matrix.suite == 'rust/tests/'
        run: .venv/bin/python scripts/golden_training_run.py check data/refactoring/golden_run_rust.json
