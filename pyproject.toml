[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indrajala-ml"
version = "0.1.0"
description = "A from-scratch, hand-derived implementation of Rosenblatt's perceptron/MADALINE and backprop classifier networks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "pytest",
    "pyarrow",
    "jsonschema",  # validates machine profiles (indrajala_ml/machine_profile.py)
    "tomli; python_version < '3.11'",  # reads rust/Cargo.toml (machine_profile.py)
    "numpy>=1.20",  # numpy.lib.stride_tricks.sliding_window_view (conv_array_layer.py)
    "typing_extensions>=4.4",  # TypeVar defaults (backprop_network_base.LayerT)
]

[tool.setuptools.packages.find]
include = ["indrajala_ml*"]
namespaces = true

[tool.setuptools.package-data]
indrajala_ml = ["machine_profile.schema.json"]

# ruff is pinned in ./cli (ruff_version), so its default rule set - which changes between
# releases - is the same locally and in CI; `./cli lint` runs both checks.
[tool.ruff]
line-length = 120
extend-exclude = ["rust"]  # the crate's own repo (submodule)

[tool.ruff.lint.per-file-ignores]
# B023: the timing closures are called inside the loop iteration that defines them.
"indrajala_ml/demos/demo_conv_rust_vs_vectorized_digit_recognition.py" = ["B023"]
"scripts/accuracy_pass_timing.py" = ["B023"]

# pinned in ./cli (pyright_version); `./cli lint` runs it. Strict everywhere. The tests read
# internals (a layer's _grad_W, a trainer's _training_accuracy) on purpose, so tests/ allows
# private names; an execution environment's root is its import root, so extraPaths keeps the repo
# root importable (tests.helpers, indrajala_ml).
[tool.pyright]
include = ["indrajala_ml", "tests", "scripts"]
typeCheckingMode = "strict"
executionEnvironments = [{ root = "tests", extraPaths = ["."], reportPrivateUsage = false }]
