name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ./cli lint: ruff and pyright at ./cli's pins. pyright needs the package's dependencies and
  # the crate's installed type stub, so this job sets up as the test jobs do (same caches) and
  # skips only the dataset and tests.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.10"

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Rust wheel key
        id: rust-commit
        run: |
          echo "sha=$(git -C rust rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "maturin=$(sed -n 's/^maturin_version="\(.*\)"$/\1/p' cli)" >> "$GITHUB_OUTPUT"

      - name: Cache crate wheel
        id: rust-wheel
        uses: actions/cache@v4
        with:
          path: .rust-wheel
          key: rust-wheel-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-maturin${{ steps.rust-commit.outputs.maturin }}-${{ steps.rust-commit.outputs.sha }}

      - name: Install pinned Rust toolchain
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        working-directory: rust
        run: rustup toolchain install

      - name: Cache crate dependency builds
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Setup
        run: ./cli setup --no-os-packages --rust-wheel-dir .rust-wheel --no-data

      - name: Lint
        run: ./cli lint

  test:
    # One job per pytest suite, run in parallel: each job pays its own setup, but the short
    # rust/tests/ job finishes inside the long tests/ one instead of adding to it.
    strategy:
      fail-fast: false
      matrix:
        suite: [tests/, rust/tests/]
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.10"

      # The whole venv, keyed on the exact interpreter and requirements.txt, so a hit leaves pip
      # nothing to install (maturin is pinned in ./cli, so pip enforces that pin on a hit too);
      # indrajala_math_rust inside the venv is always reinstalled by ./cli setup.
      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      # Keyed on scripts/fetch_datasets.py's own content, which embeds both the pinned
      # indrajala-datasets-mnist tag and each file's expected SHA-256 - so bumping either one
      # changes the hash and invalidates the cache automatically, rather than risking a stale
      # cache silently serving old data forever.
      - name: Cache MNIST dataset
        uses: actions/cache@v4
        with:
          path: data/mnist
          key: mnist-${{ hashFiles('scripts/fetch_datasets.py') }}

      # The crate's release wheel, keyed on the rust/ submodule commit, the maturin pin in ./cli
      # and the interpreter (the wheel is cp310-specific). Most PRs move none of them, so a hit
      # skips compiling the crate.
      - name: Rust wheel key
        id: rust-commit
        run: |
          echo "sha=$(git -C rust rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "maturin=$(sed -n 's/^maturin_version="\(.*\)"$/\1/p' cli)" >> "$GITHUB_OUTPUT"

      - name: Cache crate wheel
        id: rust-wheel
        uses: actions/cache@v4
        with:
          path: .rust-wheel
          key: rust-wheel-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-maturin${{ steps.rust-commit.outputs.maturin }}-${{ steps.rust-commit.outputs.sha }}

      # Only on a wheel-cache miss (a submodule bump): rust/target's dependency builds, keyed by
      # rust-cache on the toolchain, Cargo.lock and Cargo.toml; the crate itself always recompiles.
      # rust/rust-toolchain.toml's pinned toolchain, installed before rust-cache so the cache is
      # keyed on it rather than the runner image's stable.
      - name: Install pinned Rust toolchain
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        working-directory: rust
        run: rustup toolchain install

      - name: Cache crate dependency builds
        if: steps.rust-wheel.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Setup
        run: ./cli setup --no-os-packages --rust-wheel-dir .rust-wheel

      - name: Test
        run: ./cli test ${{ matrix.suite }}
